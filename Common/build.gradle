// BUILD_TIME FIX: generated through AGP Variant Sources API (2026-08-17)
// Generate the build timestamp during task execution, rather than during
// Gradle configuration. The output is registered below through AGP's Sources
// API, so configuration-cache reuse cannot freeze the timestamp.
abstract class GenerateBuildTimeTask extends org.gradle.api.DefaultTask {
    @org.gradle.api.tasks.OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()

    @org.gradle.api.tasks.TaskAction
    void generate() {
        def packageDir = outputDirectory.dir("tk/glucodata").get().asFile
        packageDir.mkdirs()

        def time = new java.text.SimpleDateFormat("HH:mm:ss dd-MMM-yyyy")
                .format(new java.util.Date())
        new File(packageDir, "BuildTime.java").text = """\
package tk.glucodata;

public final class BuildTime {
    private BuildTime() {}
    public static final String TIME = "${time}";
}
"""
    }
}

