   androidComponents {
        // Register BuildTime.java as generated Java source for every enabled variant.
        // addGeneratedSourceDirectory() assigns outputDirectory and carries the task
        // dependency automatically; no java.srcDir Provider or JavaCompile hook is needed.
        onVariants(selector().all(), { variant ->
            // One application identity controls Java and native Garmin defaults.
            // Use the final variant ID, including flavor/build-type suffixes.
            def releaseId = variant.applicationId.get() == "tk.glucodata" ? 1 : 0
            variant.buildConfigFields.put("isReleaseID",
                    new com.android.build.api.variant.BuildConfigField(
                            "int", releaseId.toString(), "Derived from applicationId"))
            def nativeBuild = variant.externalNativeBuild
            if (nativeBuild != null) {
                def releaseIdFlag = "-DRELEASEID=" + releaseId
                nativeBuild.cFlags.add(releaseIdFlag)
                nativeBuild.cppFlags.add(releaseIdFlag)
            }

            def taskName = "generate${variant.name.capitalize()}BuildTime"
            def buildTimeTask = tasks.register(taskName, GenerateBuildTimeTask) {
                // BUILD_TIME is deliberately different for every actual build invocation.
                outputs.upToDateWhen { false }
            }
            variant.sources.java.addGeneratedSourceDirectory(
                    buildTimeTask,
                    GenerateBuildTimeTask::getOutputDirectory)
        })
    }
    compileSdkMinor 0
